<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>실제 AS 현황 · 그래프 가독성 개선 5안</title><style>@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css');*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;font:500 15px/1.5 'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;color:#202a36;background:#fff}header{padding:16px 22px;border-bottom:1px solid #b8c4d0}h1{font-size:22px;margin:0 0 4px}p{margin:0;color:#526171}nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:12px}button,a{font:inherit;color:inherit}button{cursor:pointer;border:1px solid #9caaba;padding:9px 12px;background:#fff;text-align:left;border-radius:3px;min-height:40px}button[aria-pressed=true]{background:#e4edf6;border-color:#375f80;font-weight:600}button:focus-visible,a:focus-visible{outline:2px solid #375f80;outline-offset:2px}.description{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 22px;border-bottom:1px solid #b8c4d0}.description a{white-space:nowrap;text-underline-offset:4px}iframe{flex:1;width:100%;min-height:0;border:0}details{margin-top:10px}summary{cursor:pointer}.changes{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;margin:8px 0 0;padding-left:18px}@media(max-width:700px){header{padding:12px}nav{display:flex;overflow:auto}nav button{min-width:165px}.description{padding:8px 12px}.changes{grid-template-columns:1fr}}</style></head><body><header><h1>실제 AS 현황 · 그래프 가독성 개선</h1><p>현재 메뉴·도넛·접수목록을 유지한 별도 HTML 5개 · 같은 예시 70건 사용</p><nav aria-label="시안 선택"><button type="button" data-n="1" aria-pressed="true">1. 기존 배치 정돈</button><button type="button" data-n="2" aria-pressed="false">2. 추이 집중형</button><button type="button" data-n="3" aria-pressed="false">3. 업무 비교형 · 추천</button><button type="button" data-n="4" aria-pressed="false">4. 월별 가로 비교표</button><button type="button" data-n="5" aria-pressed="false">5. 확인 사항·원장형</button></nav><details><summary>개선 근거 · 데이터 확인 사항</summary><p>단일 막대로 월별 건수를 비교하고, 2~5안은 유형별 가로 막대를 사용합니다. 전체 대기와 단계 합계, 접수일 기준, 현재까지의 집계와 미도래를 구분합니다.</p><p><a href="review.html" target="_blank" rel="noopener">현재 UI 문제 · 데이터 확인 사항 · 5안의 선택 기준 자세히 보기 ↗</a></p></details></header><div class="description"><p id="description">기존 배치와 도넛을 유지한 최소 변경안. 0건 유형을 접고 대기 건수 관계를 분명히 합니다.</p><a id="open" href="concept-1.html" target="_blank" rel="noopener">독립 HTML 열기 ↗</a></div><iframe id="preview" src="concept-1.html" title="실제 AS 현황 시안 1"></iframe><script>const descriptions=["기존 배치와 도넛을 유지한 최소 변경안. 0건 유형을 접고 대기 건수 관계를 분명히 합니다.","월별 추이를 넓게 배치하고 유형은 가로 막대로 비교합니다. 연간 흐름을 파악하기 좋습니다.","월별 접수와 유형별 가로 막대를 나란히 비교합니다. 일상적인 업무 현황 파악에 추천합니다.","12개월 수치를 가로로 비교하고 아래에서 그래프를 확인합니다. 월별 대조 업무에 적합합니다.","금액 미입력·기타 분류를 확인하고 월별 접수·완료·미완료·금액 원장을 함께 봅니다."];for(const button of document.querySelectorAll('nav button'))button.onclick=()=>{const n=Number(button.dataset.n);for(const b of document.querySelectorAll('nav button'))b.setAttribute('aria-pressed',String(b===button));document.getElementById('preview').src='concept-'+n+'.html';document.getElementById('preview').title='실제 AS 현황 시안 '+n;document.getElementById('description').textContent=descriptions[n-1];document.getElementById('open').href='concept-'+n+'.html'};</script></body></html>
