name: Desktop checks
on:
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop-*.yml', 'cover.html', 'cover-assets/erp-startup.*', 'cover-assets/tide*', 'cover-assets/typography.css', 'cover-assets/headline-motion.css', 'cover-assets/app-flow-theme.css', 'cover-assets/*.otf']
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm test --prefix desktop
      - name: Test Rust integration and native taskbar icon
        working-directory: desktop/src-tauri
        env:
          PROCESS_SERVER_URL: http://127.0.0.1:3000/
        run: cargo test --locked --target x86_64-pc-windows-msvc
