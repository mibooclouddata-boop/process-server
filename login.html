<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HANKUK MIBOO — 로그인</title>
<link rel="stylesheet" href="/cover-assets/login-transition.css?v=2">
<style>
  :root {
    --toss-blue: #004A93;
    --toss-blue-hover: #003a75;
    --toss-blue-light: #e6eef7;
    --bg: #ffffff;
    --bg-soft: #f9fafb;
    --bg-input: #f2f4f6;
    --text-900: #191f28;
    --text-700: #333d4b;
    --text-500: #6b7684;
    --text-400: #8b95a1;
    --text-300: #b0b8c1;
    --border: #e5e8eb;
    --danger: #f04452;
    --success: #00c471;
    --radius-lg: 14px;
    --radius-md: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', sans-serif;
    color: var(--text-900);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    letter-spacing: -0.01em;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background: #fff;
  }

  .header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(255,255,255,0.85);
    backdrop-filter: saturate(180%) blur(12px);
    -webkit-backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid rgba(229,232,235,0.6);
  }
  .header-inner {
    width: 100%;
    margin: 0;
    padding: 0 24px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .logo img {
    height: 32px;
    width: auto;
    display: block;
  }
  .nav { display: flex; gap: 28px; align-items: center; }
  .nav a {
    color: var(--text-700);
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
  }
  .nav a:hover { color: var(--text-900); }
  .header-cta {
    background: var(--bg-input);
    color: var(--text-900);
    border: none;
    padding: 10px 16px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  .header-cta:hover { background: #e8eaed; }

  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
    padding: 48px 24px 80px;
    gap: 48px;
    align-items: center;
  }

  .hero h1 {
    font-size: 48px;
    font-weight: 800;
    line-height: 1.25;
    letter-spacing: -0.04em;
    color: var(--text-900);
    margin-bottom: 20px;
  }
  .hero h1 .accent { color: var(--toss-blue); }

  .rotator {
    display: flex !important;
    flex-direction: column;
    font-size: 36px !important;
    font-weight: 900 !important;
    line-height: 1.1 !important;
    letter-spacing: -0.05em !important;
    margin-bottom: 24px !important;
  }
  .line {
    display: block;
    overflow: visible;
  }
  .word {
    display: inline-block;
    color: var(--text-900);
    transition: color 0.5s ease, transform 0.5s ease, text-shadow 0.5s ease;
    will-change: color, transform;
  }

  .w1, .w2, .w3 {
    letter-spacing: 0.24em;
    margin-right: -0.24em;
  }

  .w1 { animation: highlight 10.8s infinite; animation-delay: 0s; }
  .w2 { animation: highlight 10.8s infinite; animation-delay: 3.6s; }
  .w3 { animation: highlight 10.8s infinite; animation-delay: 7.2s; }

  @keyframes highlight {
    0%, 100% {
      color: var(--text-900);
      transform: translateY(0) scale(1);
      text-shadow: none;
    }
    3%, 30% {
      color: var(--toss-blue);
      transform: translateY(-2px) scale(1.02);
      text-shadow: 0 6px 24px rgba(49,130,246,0.25);
    }
    33% {
      color: var(--text-900);
      transform: translateY(0) scale(1);
      text-shadow: none;
    }
  }
  .hero p.lead {
    font-size: 17px;
    line-height: 1.55;
    color: var(--text-500);
    margin-bottom: 28px;
    font-weight: 500;
  }

  .stats {
    display: flex;
    gap: 32px;
    margin-top: 28px;
  }
  .stat .num {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--text-900);
  }
  .stat .num em {
    color: var(--toss-blue);
    font-style: normal;
  }
  .stat .label {
    font-size: 13px;
    color: var(--text-500);
    margin-top: 4px;
    font-weight: 500;
  }

  .trust {
    margin-top: 40px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px;
    background: var(--bg-soft);
    border-radius: var(--radius-md);
    width: fit-content;
  }
  .trust .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 0 4px rgba(0,196,113,0.15);
  }
  .trust span {
    font-size: 13px;
    color: var(--text-700);
    font-weight: 600;
  }

  .form-card {
    background: #fff;
    border-radius: 20px;
    padding: 56px 44px;
    box-shadow:
      0 1px 2px rgba(0,0,0,0.04),
      0 8px 24px rgba(17,24,39,0.06),
      0 24px 48px rgba(17,24,39,0.04);
    border: 1px solid var(--border);
    max-width: 460px;
    width: 100%;
    justify-self: end;
  }

  .form-title {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-bottom: 36px;
    color: var(--text-900);
  }
  .form-subtitle {
    font-size: 14px;
    color: var(--text-500);
    font-weight: 500;
    margin-bottom: 28px;
  }

  .input-stack {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 28px;
  }
  .input-field {
    position: relative;
  }
  .input-field input {
    width: 100%;
    height: 64px;
    border: 1.5px solid #83909e;
    background: #fff;
    border-radius: var(--radius-md);
    padding: 24px 16px 8px;
    font-size: 16px;
    font-weight: 500;
    color: var(--text-900);
    font-family: inherit;
    transition: border-color 0.15s ease, background 0.15s ease;
    outline: none;
    letter-spacing: -0.01em;
  }
  .input-field input:focus {
    border-color: var(--toss-blue);
    background: #fff;
  }
  .input-field input:focus + label,
  .input-field input:not(:placeholder-shown) + label {
    top: 10px;
    font-size: 11px;
    color: var(--text-500);
    font-weight: 600;
  }
  .input-field label {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-400);
    font-size: 15px;
    font-weight: 500;
    pointer-events: none;
    transition: top 0.15s ease, font-size 0.15s ease, color 0.15s ease, transform 0.15s ease;
    background: transparent;
  }
  .input-field input:focus + label,
  .input-field input:not(:placeholder-shown) + label {
    transform: translateY(0);
  }

  .toggle-eye {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-400);
    border-radius: 6px;
  }
  .toggle-eye:hover { color: var(--text-700); background: rgba(0,0,0,0.04); }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
  }
  .checkbox {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }
  .checkbox input {
    appearance: none;
    width: 18px;
    height: 18px;
    border: 1.5px solid var(--border);
    border-radius: 5px;
    cursor: pointer;
    position: relative;
    background: #fff;
    transition: all 0.15s ease;
  }
  .checkbox input:checked {
    background: var(--toss-blue);
    border-color: var(--toss-blue);
  }
  .checkbox input:checked::after {
    content: '';
    position: absolute;
    left: 5px; top: 1px;
    width: 5px; height: 10px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .checkbox span { font-size: 14px; color: var(--text-700); font-weight: 500; }

  .link-ghost {
    background: none;
    border: none;
    color: var(--text-500);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    padding: 4px 0;
  }
  .link-ghost:hover { color: var(--toss-blue); }

  .btn-primary {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 60px;
    background: var(--toss-blue);
    color: #fff;
    border: none;
    border-radius: var(--radius-md);
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: -0.01em;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  .btn-primary:hover { background: var(--toss-blue-hover); }
  .btn-primary:active { transform: scale(0.995); }
  .btn-primary:disabled {
    background: var(--bg-input);
    color: var(--text-300);
    cursor: not-allowed;
  }

  /* ===== 로그인 버튼 → 스피너 모핑 ===== */
  .btn-primary.is-loading {
    color: transparent;
    pointer-events: none;
    background: var(--toss-blue);
  }
  .btn-primary.is-loading::before {
    content: '';
    position: absolute;
    width: 22px;
    height: 22px;
    border: 2.5px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  .btn-primary.is-error {
    animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .form-footer {
    margin-top: 36px;
    text-align: center;
    font-size: 14px;
    color: var(--text-500);
    font-weight: 500;
  }
  .form-footer a {
    color: var(--toss-blue);
    text-decoration: none;
    font-weight: 700;
  }
  .form-footer a:hover { text-decoration: underline; }

  .footer {
    border-top: 1px solid var(--border);
    background: var(--bg-soft);
    padding: 32px 24px;
    font-size: 13px;
    color: var(--text-500);
  }
  .footer-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .footer-links { display: flex; gap: 20px; }
  .footer-links a { color: var(--text-500); text-decoration: none; }
  .footer-links a:hover { color: var(--text-900); }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .hero > * { animation: fadeSlideUp 0.5s ease both; }
  .hero > *:nth-child(1) { animation-delay: 0.05s; }
  .hero > *:nth-child(2) { animation-delay: 0.12s; }
  .hero > *:nth-child(3) { animation-delay: 0.18s; }
  .hero > *:nth-child(4) { animation-delay: 0.24s; }
  .form-card { animation: fadeSlideUp 0.5s ease 0.1s both; }

  @media (max-width: 900px) {
    .main {
      grid-template-columns: 1fr;
      padding: 32px 20px 60px;
      gap: 32px;
    }
    .hero h1 { font-size: 34px; }
    .rotator { font-size: 36px !important; }
    .hero p.lead { font-size: 16px; }
    .form-card { justify-self: stretch; max-width: 100%; padding: 32px 24px; }
    .stats { gap: 20px; }
    .stat .num { font-size: 22px; }
    .nav { display: none; }
  }
</style>

<style id="centered-layout">
/* Only layout changes. Original typography, form styles and animation remain intact. */
.main{display:grid;grid-template-columns:minmax(0,1fr);place-items:center;gap:0;max-width:none;min-height:100vh;min-height:100svh;padding:40px 24px;margin:0}
.form-card{justify-self:center;width:100%;max-width:360px;padding:0;border:0;border-radius:0;box-shadow:none;background:transparent}
.centered-logo{display:block;width:188px;max-width:100%;height:auto;margin:0 auto 36px}
@media(max-width:900px){.main{grid-template-columns:minmax(0,1fr);gap:0;padding:32px 24px}.form-card{justify-self:center;max-width:360px;padding:0}}
</style>
<style id="refinements">
:root{--text-400:#626f7d;--danger:#bf2638}.login-group{width:100%;max-width:360px;justify-self:center}.centered-logo{width:208px;height:auto;aspect-ratio:1921 / 414;margin:0 auto 36px;opacity:1;transform:none;filter:none}.form-card{width:100%}.form-card:not(.is-leaving){animation:refinedEnter .5s ease .1s backwards}@keyframes refinedEnter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.input-field input:focus+label,.input-field input:not(:placeholder-shown)+label{font-size:12px}.input-field input{padding-right:16px}#password{padding-right:60px}.toggle-eye{width:44px;height:44px;right:6px;top:10px;transform:none}.input-field label{top:32px}.input-field input:focus+label,.input-field input:not(:placeholder-shown)+label{top:10px}.checkbox{min-height:44px}.row{margin-bottom:24px}.input-stack{margin-bottom:16px}.checkbox input{border-color:#83909e}.field-error,.form-message{font-size:13px;line-height:1.6;color:var(--danger);margin-top:8px}.field-error:empty,.form-message:empty{display:none}.form-message{margin-top:14px}.input-field input[aria-invalid=true]{border-color:var(--danger)}button:focus-visible,a:focus-visible,input[type=checkbox]:focus-visible{outline:3px solid var(--toss-blue);outline-offset:4px}.btn-primary.is-loading:disabled{background:var(--toss-blue);color:transparent}.btn-primary.is-loading::before{border-top-color:#fff}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head>
<body class="login-background">
<script src="/cover-assets/login-transition.js?v=1" data-page="login"></script>



  <main class="main">



    <div class="login-group"><img class="centered-logo" src="miboo_logo.png" alt="HANKUK MIBOO" width="1921" height="414" decoding="sync" /><aside class="form-card" aria-label="로그인 폼">


      <form id="loginForm" autocomplete="on" novalidate>
        <div class="input-stack">

          <div class="input-field">
            <input
              id="identifier"
              name="identifier" aria-describedby="identifierError"
              type="text"
              placeholder=" "
              autocomplete="username"
              required
            />
            <label for="identifier">아이디</label><p class="field-error" id="identifierError"></p>
          </div>

          <div class="input-field">
            <input
              id="password"
              name="password" aria-describedby="passwordError"
              type="password"
              placeholder=" "
              autocomplete="current-password"
              required
            />
            <label for="password">비밀번호</label>
            <button type="button" class="toggle-eye" id="togglePw" aria-label="비밀번호 표시" aria-pressed="false">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button><p class="field-error" id="passwordError"></p>
          </div>

        </div>

        <div class="row">
          <label class="checkbox">
            <input type="checkbox" id="keep" />
            <span>로그인 상태 유지</span>
          </label>

        </div>

        <button type="submit" class="btn-primary" id="submitBtn">로그인</button><p class="form-message" id="loginMessage" role="alert" tabindex="-1"></p>


      </form>
    </aside></div>
  </main>

  <script>
const pw=document.getElementById('password'),toggle=document.getElementById('togglePw'),form=document.getElementById('loginForm'),idInput=document.getElementById('identifier'),btn=document.getElementById('submitBtn'),message=document.getElementById('loginMessage');
let busy=false;
toggle.addEventListener('click',()=>{const show=pw.type==='password';pw.type=show?'text':'password';toggle.setAttribute('aria-pressed',String(show));toggle.setAttribute('aria-label',show?'비밀번호 숨기기':'비밀번호 표시');});
function fieldError(input,text){document.getElementById(input===pw?'passwordError':'identifierError').textContent=text;input.setAttribute('aria-invalid',String(!!text));}
[idInput,pw].forEach(input=>input.addEventListener('input',()=>{fieldError(input,'');message.textContent='';}));
function showError(text){message.textContent=text;message.focus();btn.classList.add('is-error');setTimeout(()=>btn.classList.remove('is-error'),500);}
form.addEventListener('submit',async e=>{
 e.preventDefault();if(busy)return;
 const missingId=!idInput.value.trim(),badPassword=pw.value.length<4;
 fieldError(idInput,missingId?'아이디를 입력해 주세요.':'');fieldError(pw,badPassword?'비밀번호를 4자 이상 입력해 주세요.':'');
 if(missingId||badPassword){(missingId?idInput:pw).focus();return;}
 if(location.protocol==='file:'){showError('실제 로그인은 process-server에서 이 HTML을 열어 이용해 주세요.');return;}
 busy=true;btn.disabled=true;btn.classList.remove('is-error');btn.classList.add('is-loading');btn.setAttribute('aria-busy','true');btn.setAttribute('aria-label','로그인 중');message.textContent='';
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);let succeeded=false;
 try{
  const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'process-server'},body:JSON.stringify({id:idInput.value.trim(),password:pw.value}),signal:controller.signal});
  const data=await res.json().catch(()=>({}));
  if(!res.ok||!data.success){showError(res.status>=500?'서버 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.':'로그인에 실패했습니다. 아이디와 비밀번호를 확인해 주세요.');return;}
  try{sessionStorage.setItem('currentUser',JSON.stringify(data.user));if(document.getElementById('keep').checked)localStorage.setItem('currentUser',JSON.stringify(data.user));else localStorage.removeItem('currentUser');}catch(error){showError('로그인 정보를 저장하지 못했습니다. 브라우저의 저장소 설정을 확인해 주세요.');return;}
  succeeded=true;pw.value='';
  if(window.LoginTransition)window.LoginTransition.start({name:data.user?.name||idInput.value.trim()});
  else window.location.href='/dashboard.html';
 }catch(error){showError(error.name==='AbortError'?'서버 응답이 지연되고 있습니다. 잠시 후 다시 시도해 주세요.':'서버에 연결하지 못했습니다. 네트워크를 확인하고 다시 시도해 주세요.');}
 finally{clearTimeout(timeout);if(!succeeded){busy=false;btn.disabled=false;btn.classList.remove('is-loading');btn.removeAttribute('aria-busy');btn.removeAttribute('aria-label');}}
});
function resetLoginForm(){busy=false;btn.disabled=false;btn.classList.remove('is-loading');btn.removeAttribute('aria-busy');btn.removeAttribute('aria-label');}
window.addEventListener('pageshow',event=>{if(event.persisted)resetLoginForm();});
window.addEventListener('login-transition-reset',resetLoginForm);
</script>

</body>
</html>
