[package]
name = "process-server-desktop"
version = "0.3.1"
description = "Process Server ERP desktop client"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls", "system-proxy"] }
tauri-plugin-updater = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
